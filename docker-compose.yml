# Three-node EdgeSync demo with Prometheus and Grafana
x-node: &node
  build: .
  restart: unless-stopped
  networks: [edgesync]
services:
  node1:
    <<: *node
    command: ["-id","node-1","-http",":8080","-data","/data","-pprof","","-peers","node-1=node1:8080,node-2=node2:8080,node-3=node3:8080"]
    ports: ["8081:8080"]
    volumes: ["node1-data:/data"]
  node2:
    <<: *node
    command: ["-id","node-2","-http",":8080","-data","/data","-pprof","","-peers","node-1=node1:8080,node-2=node2:8080,node-3=node3:8080"]
    ports: ["8082:8080"]
    volumes: ["node2-data:/data"]
  node3:
    <<: *node
    command: ["-id","node-3","-http",":8080","-data","/data","-pprof","","-peers","node-1=node1:8080,node-2=node2:8080,node-3=node3:8080"]
    ports: ["8083:8080"]
    volumes: ["node3-data:/data"]
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [edgesync]
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/edgesync.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    networks: [edgesync]
volumes:
  node1-data: {}
  node2-data: {}
  node3-data: {}
networks:
  edgesync: {}
